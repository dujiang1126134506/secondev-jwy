description = "E10 集成企业微信日程（会议提醒）二开模块"

// 后端二开打包规范（文档 2.6.1）：排除 resources 目录，二开配置通过外部文件提供，
// 避免资源打进 jar 导致多二开包冲突；部署后在服务器放置同名外部配置文件即可覆盖。
sourceSets {
    main {
        resources {
            exclude '**'
        }
    }
}

dependencies {
    // 子项目私有依赖添加（fastjson / httpclient 已由根项目 secDevLib 提供，无需重复声明）
}