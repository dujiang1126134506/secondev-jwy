# ============================================================
# 泛微 E10 集成企业微信日程（会议提醒）配置
# author: DuJiang
#
# 部署说明：
#  - 该文件位于 src/main/resources，打包后进入 jar 的 META-INF/res.list 清单，
#    随 build.zip 一起部署到 E10。
#  - 同步服务运行时会优先读取外部绝对路径配置文件（见 WeComConfig.load），
#    便于运维按环境覆盖，无需重新打包。
# ============================================================

# ---- 企业微信自建应用 ----
# 在企业微信后台「应用管理」创建自建应用后获取
wecom.corpid=1000012
wecom.corpsecret=1lqdW8Q1aPVmkZVZRi3Pvzb5Th7xIVL7-xE4L4bvrQM

# ---- access_token 缓存 ----
# 提前刷新秒数：token 有效期 7200s，此处设置提前 200s 过期刷新，避免临界失效
wecom.token.safe.secs=200

# ---- 企业微信 OA 日程 API 域名 ----
wecom.api.base=https://qyapi.weixin.qq.com/cgi-bin

# ---- 共享日历 ----
# 日历标题模板，{meetingId} 会被替换为会议 ID
wecom.calendar.title=E10会议-{meetingId}
wecom.calendar.description=来自 OA 的会议提醒

# ---- 日程提醒（秒级提前量，逗号分隔）----
# 3600=提前1小时，600=提前10分钟
wecom.remind.before.secs=3600,600

# ---- E10 账号 -> 企业微信 userid 映射模式 ----
# direct : 约定「E10 登录名 = 企业微信 userid」，直接透传（默认，免维护映射表）
# phone  : E10 登录名 -> 查 E10 人员表手机号 -> 企微 user/get_by_mobile 换 userid
#          适用于 E10 与企微按手机号自动绑定的场景
# mobile : 参会人直接传手机号 -> 企微 user/get_by_mobile 换 userid
wecom.userid.mode=phone

# ---- E10 多租户组织识别码（组织识别码）----
# 用于 eteams.employee 等组织表的多租户过滤，本测试环境为 t862ksqtzu；正式环境按实际填写
wecom.tenant.key=t862ksqtzu

# phone 模式下查询手机号的 SQL（E10 版本，必须含 ? 占位符，查询结果列名为 mobile）
# 使用 E10 原生人员主表 eteams.employee（E10 组织数据位于 eteams 库，RecordSet 默认连接 ecology10 库，须带库前缀）
# 登录列为 username（E10 登录名，实测唯一且全部有值；工号 JOB_NUM 大多为空，勿用作匹配列）
# 手机号列 mobile，租户过滤列 TENANT_KEY；STATUS='normal' 在职、TYPE='inside' 内部账号、delete_type=0 未删除
# 两个 ? 顺序：登录名、租户键（由 wecom.tenant.key 提供）
# 注意：区别于 E9 的 SELECT mobile FROM HrmResource WHERE loginid = ?；也非云桥表 eb_hrm_user（本环境为空）
# 若会议模块传入的是 E10 工号，可改为按 JOB_NUM 匹配：
#   SELECT mobile FROM eteams.employee WHERE JOB_NUM = ? AND TENANT_KEY = ? AND delete_type = 0 AND STATUS = 'normal' AND TYPE = 'inside'
wecom.userid.phone.sql=SELECT mobile FROM eteams.employee WHERE username = ? AND TENANT_KEY = ? AND delete_type = 0 AND STATUS = 'normal' AND TYPE = 'inside'
